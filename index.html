<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LOST SIGNAL</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <div class="top">
            <span>LOST SIGNAL</span>
            <span>01 / 04</span>
        </div>

        <p class="system">> CONNECTION ESTABLISHED.....</p>

        <h1>SIGNAL 01</h1>

        <p class="message">
            A signal was found.
        </p>

        <p class="message">
            It does not look like a normal message.
        </p>

        <section class="signal-card">

            <p class="label">SIGNAL</p>

            <p class="message">
                18 - 5 - 4 - 0 - 24
            </p>

            <p class="hint">
                > something is hidden inside the numbers.
            </p>

        </section>

        <section class="puzzle">

            <p class="label">DECODE</p>

            <input
                id="answerBox"
                type="text"
                autocomplete="off"
                placeholder="enter answer"
            >

            <button id="answerButton" type="button">
                SUBMIT
            </button>

            <p id="answerResult"></p>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
